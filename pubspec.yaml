name: caligo
description: CaliGo - Transit cards, stops and lines for Cali.
publish_to: "none"
version: 4.0.3+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.3

  # Database
  sqflite: ^2.3.2
  path: ^1.8.3

  # Networking
  http: ^1.2.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.20.2
  share_plus: ^12.0.1
  file_picker: ^10.3.7
  path_provider: ^2.1.2
  package_info_plus: ^8.1.3

  # Navigation
  go_router: ^17.0.0

  # Maps, location and links
  geolocator: ^14.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Sources in assets/icon; regenerate with `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#3F1D7A"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - LICENSE
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-IBMPlexSans.txt
    - assets/fonts/OFL-IBMPlexMono.txt

  # Static instances cut from the variable fonts of the browser
  # extensions (Fraunces at opsz 24 and 14, Plex Sans at each weight).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-Italic.ttf
          weight: 400
          style: italic
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
